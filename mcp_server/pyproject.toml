[project]
name = "copla"
version = "0.1.0"
description = "MCP server that connects AI assistants (Claude, opencode, Cursor, ...) to a live QGIS session through the Copla plugin. Typed tools only - no arbitrary code execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Daniel Malan" }]
keywords = ["qgis", "mcp", "ai", "gis", "model-context-protocol"]
dependencies = ["mcp>=2.0"]

[project.scripts]
copla = "copla.server:main"

[project.urls]
Homepage = "https://github.com/pepehalfonso/copla-plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copla"]
